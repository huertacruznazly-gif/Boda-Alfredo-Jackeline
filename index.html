<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boda Alfredo & Jackeline</title>
<style>
body{margin:0;font-family:serif;background:#fffaf5;text-align:center}
#sobre{position:fixed;inset:0;background:#fdf6ee;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:1s}
#sobre.abierto{transform:translateY(-100%);opacity:0}
button{padding:14px 28px;border-radius:30px;border:none;background:#b08968;color:white;font-size:1.1rem}
#btnM{position:fixed;bottom:20px;right:20px;z-index:50;width:50px;height:50px;border-radius:50%;font-size:22px}
</style>
</head>
<body>

<div id="sobre">
<h1>Alfredo & Jackeline</h1>
<p>21 • 12 • 2025</p>
<button onclick="abrirSobre()">ABRIR INVITACIÓN ♡</button>
</div>

<div style="padding:40px 20px">
<h2>Más que Invitado</h2>
<p>Con la bendición de Dios y el amor que nos une, queremos que nos acompañen</p>
<div style="font-size:2rem;margin:40px 0">Nuestra Historia</div>
<p>Desde la primera mirada, ahora continúa para siempre...</p>
<img src="foto.jpg" style="width:90%;max-width:400px;border-radius:20px;margin:20px 0">
<br><br>
<a href="https://wa.me/5215528551249?text=Hola!%20Confirmo%20mi%20asistencia%20a%20la%20boda%20de%20Alfredo%20y%20Jackeline" style="display:inline-block;background:#25D366;color:white;padding:15px 25px;border-radius:30px;text-decoration:none">Confirmar por WhatsApp</a>
<p style="font-size:.8rem;opacity:.7;margin-top:20px">Cambia el número en el código si lo necesitas</p>
</div>

<audio id="audio" loop><source src="musica.mp3" type="audio/mpeg"></audio>
<button id="btnM" onclick="toggleM()">♫</button>

<script>
let play=false;
function abrirSobre(){
 document.getElementById('sobre').classList.add('abierto');
 let a=document.getElementById('audio');a.volume=0.8;a.load();
 a.play().then(()=>{play=true;document.getElementById('btnM').innerHTML='||'}).catch(()=>{});
}
function toggleM(){
 let a=document.getElementById('audio');
 if(play){a.pause();play=false;document.getElementById('btnM').innerHTML='♫'}
 else{a.play();play=true;document.getElementById('btnM').innerHTML='||'}
}
</script>
</body>
</html>
