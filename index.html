<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alfredo & Jackeline</title><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Montserrat,sans-serif;background:#fdf8f4;text-align:center}#sobre{position:fixed;inset:0;background:#fdf8f4;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:1s}.abierto{transform:translateY(-100%)}.cir{width:120px;height:120px;background:#c9a88a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}.hero{height:100vh;position:relative;display:flex;align-items:end;justify-content:center;padding-bottom:70px;color:#fff}.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),transparent)}.hero-content{position:relative;z-index:2}.hero h1{font-family:Great Vibes,cursive;font-size:70px}.btn{background:#c9a88a;color:#fff;padding:12px 28px;border-radius:30px;text-decoration:none;display:inline-block;margin-top:15px}.contador{display:flex;justify-content:center;gap:8px}.contador div{background:#fff;padding:10px;border-radius:12px;min-width:65px}.card{background:#fff;margin:15px auto;max-width:460px;padding:25px;border-radius:20px}</style></head><body><div id="sobre"><div class="cir">♥</div><h1 style="font-family:Great Vibes,cursive;color:#c9a88a;font-size:48px;margin-top:20px">Alfredo & Jackeline</h1><button class="btn" onclick="document.getElementById('sobre').classList.add('abierto');document.getElementById('m').play()">ABRIR INVITACIÓN</button></div><audio id="m" loop src="https://cdn.pixabay.com/download/audio/2022/06/07/audio_b9bd4170e8.mp3"></audio><div class="hero"><img src="foto.jpg"><div class="hero-content"><p>NOS CASAMOS</p><h1>Alfredo<br>& Jackeline</h1><p>31 • OCTUBRE • 2026</p></div></div><div style="padding:50px 20px"><p><i>"Juntamos nuestras vidas, nuestros sueños y nuestras locuras, para ser uno mismo."</i></p></div><div style="background:#f6efe8;padding:30px"><div class="contador" id="c"></div></div><div style="padding:20px"><div class="card"><h2>Iglesia</h2><p>Parroquia San José Chicoloapan<br>5:40 PM</p><a class="btn" href="https://maps.google.com/?q=Parroquia+San+Jose+Chicoloapan" target="_blank">VER UBICACIÓN</a></div><div class="card"><h2>Fiesta</h2><p>Hacienda La Palma</p><a class="btn" href="https://maps.google.com/?q=Hacienda+La+Palma+Chimalhuacan" target="_blank">VER UBICACIÓN</a></div></div><script>const f=new Date("Oct 31, 2026 17:40:00").getTime();setInterval(()=>{let d=f-new Date().getTime();document.getElementById("c").innerHTML=`<div><b>${Math.floor(d/86400000)}</b><br>Días</div><div><b>${Math.floor(d%86400000/3600000)}</b><br>Hrs</div><div><b>${Math.floor(d%3600000/60000)}</b><br>Min</div><div><b>${Math.floor(d%60000/1000)}</b><br>Seg</div>`},1000)</script></body></html>
